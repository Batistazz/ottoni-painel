<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoje · lente Dono · protótipo</title>
<link rel="stylesheet" href="../assets/fontes/fontes.css">
<style>
body{margin:0;background:#050506}
a{color:#F2EFE9}a:hover{color:#FFFFFF}
.ic{width:20px;height:20px;flex:none;fill:currentColor}
.ic.sm{width:16px;height:16px}
.vidro{position:relative;background:rgba(44,44,48,.52);-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.05);backdrop-filter:blur(26px) saturate(190%) brightness(1.05);box-shadow:0 1px 1px rgba(0,0,0,.5),0 10px 28px rgba(0,0,0,.5),0 30px 70px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.22),inset 0 -10px 18px -14px rgba(0,0,0,.3)}
.rot{font-family:-apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(235,235,245,.6)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.28)}
.seg button{font:500 13px -apple-system,"SF Pro Text",system-ui,sans-serif;min-height:34px;padding:0 14px;border-radius:999px;background:none;border:0;color:rgba(235,235,245,.6);cursor:pointer}
.seg button.on{background:rgba(255,255,255,.92);color:#0B0B0C;font-weight:600}
.carta{flex:none;width:140px;height:188px;border-radius:18px;border:0;padding:14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;cursor:pointer;color:rgba(235,235,245,.6);font:500 13px -apple-system,system-ui,sans-serif;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% -10%,#3a3a3f 0%,#18181b 55%,#0e0e10 100%);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.18);opacity:.55;transform:scale(.94);transition:transform .25s cubic-bezier(.34,1.3,.5,1),opacity .2s}
.carta.on{opacity:1;transform:scale(1.04);color:#F2EFE9;box-shadow:0 26px 60px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.55),inset 0 1px 0 rgba(255,255,255,.4)}
.carta .ini{position:absolute;left:12px;top:2px;font-family:'Bebas Neue',sans-serif;font-size:110px;line-height:1;color:rgba(255,255,255,.07)}
.carta b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:30px;line-height:1;color:#F2EFE9;letter-spacing:.02em}
.bolinha{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;color:#F2EFE9;cursor:pointer}
.doca a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:68px;min-height:52px;justify-content:center;border-radius:16px;color:rgba(235,235,245,.6);text-decoration:none;font:500 11px -apple-system,system-ui,sans-serif}
.doca a.on{color:#F2EFE9;background:rgba(255,255,255,.1)}
.vaga{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;border-top:.5px solid rgba(235,235,245,.14);font:400 15px -apple-system,system-ui,sans-serif}
.ctx{color:#F2EFE9;text-decoration:none;font:500 14px -apple-system,system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;border-bottom:.5px solid rgba(242,239,233,.7);padding:2px 0}
.escolha{background:none;border:0;padding:0;cursor:pointer;opacity:.55;transform:scale(.92);transition:transform .25s cubic-bezier(.34,1.3,.5,1),opacity .2s;filter:drop-shadow(0 16px 20px rgba(0,0,0,.6))}
.escolha.on{opacity:1;transform:scale(1.08);filter:drop-shadow(0 0 20px rgba(233,206,122,.55)) drop-shadow(0 22px 26px rgba(0,0,0,.65))}
.fut{--w:128px;position:relative;width:var(--w);height:calc(var(--w) * 1.42);flex:none;clip-path:polygon(14% 0,86% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%);padding:calc(var(--w) * .08) calc(var(--w) * .09) calc(var(--w) * .17);box-sizing:border-box;display:flex;flex-direction:column;font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:#2B2108;overflow:hidden;text-align:left}
.fut.ouro{background:linear-gradient(160deg,#F6E39A 0%,#D9B455 28%,#A7802C 55%,#E9CE7A 78%,#8C6A22 100%)}
.fut.prata{background:linear-gradient(160deg,#F4F6F8 0%,#C3C8CF 30%,#8D939C 55%,#DADDE2 78%,#6F757D 100%);color:#1E2126}
.fut.preta{background:radial-gradient(120% 80% at 30% 0%,#45454c 0%,#141416 48%,#050506 100%);color:#F2EFE9}
.fut.oculta{background:repeating-linear-gradient(-35deg,#0B0B0C 0 14px,#17171a 14px 20px);color:#9A9CA1}
.fut::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 48%,transparent 60%);transform:translateX(-130%);animation:brilho 5s ease-in-out infinite}
@keyframes brilho{0%,65%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.fut .topo{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.fut .ovr{font-family:'Bebas Neue',sans-serif;font-size:calc(var(--w) * .27);line-height:.82}
.fut .pos{font-weight:700;font-size:calc(var(--w) * .08);letter-spacing:.1em;margin-top:2px}
.fut .busto{width:58%;height:auto;margin:-2% -4% 0 0}
.fut .nome{position:relative;z-index:1;font-family:'Bebas Neue',sans-serif;font-size:calc(var(--w) * .16);line-height:1;text-align:center;letter-spacing:.04em;margin-top:auto;padding-bottom:3px;border-bottom:1px solid currentColor}
.fut .s1{position:relative;z-index:1;text-align:center;font-weight:700;font-size:calc(var(--w) * .085);letter-spacing:.08em;margin-top:4px}
@media (prefers-reduced-motion:reduce){.escolha{transition:none}.fut::before{animation:none;display:none}}
</style>

</head>
