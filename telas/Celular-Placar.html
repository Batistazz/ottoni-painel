body{margin:0;background:#050506}

.vidro{background:rgba(44,44,48,.52);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.22)}
.fut{--w:230px;position:relative;width:var(--w);height:calc(var(--w) * 1.42);flex:none;clip-path:polygon(14% 0,86% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%);padding:calc(var(--w) * .08) calc(var(--w) * .09) calc(var(--w) * .17);box-sizing:border-box;display:flex;flex-direction:column;font-family:'Barlow Condensed','Arial Narrow',sans-serif;color:#2B2108;overflow:hidden;background:linear-gradient(160deg,#F6E39A 0%,#D9B455 28%,#A7802C 55%,#E9CE7A 78%,#8C6A22 100%)}
.fut::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 48%,transparent 60%);transform:translateX(-130%);animation:brilho 4s ease-in-out infinite}
@keyframes brilho{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.fut .topo{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.fut .ovr{font-family:'Bebas Neue',sans-serif;font-size:calc(var(--w) * .27);line-height:.82}
.fut .pos{font-weight:700;font-size:calc(var(--w) * .075);letter-spacing:.1em;margin-top:2px}
.fut .busto{width:60%;height:auto;margin:-2% -4% 0 0}
.fut .nome{position:relative;z-index:1;font-family:'Bebas Neue',sans-serif;font-size:calc(var(--w) * .155);line-height:1;text-align:center;letter-spacing:.04em;margin-top:auto;padding-bottom:3px;border-bottom:1px solid rgba(0,0,0,.25)}
.fut .stats{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:5px;font-weight:700;font-size:calc(var(--w) * .066);letter-spacing:.08em}
.fut .stats b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:calc(var(--w) * .1);letter-spacing:0;margin-right:4px}
.fut .pe{position:relative;z-index:1;text-align:center;font-weight:600;font-size:calc(var(--w) * .052);letter-spacing:.32em;margin-top:5px;opacity:.75}
.raios{position:absolute;left:50%;top:44%;width:760px;height:760px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(233,206,122,.16) 0deg 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 62%);mask-image:radial-gradient(circle,#000 0%,transparent 62%);animation:gira 40s linear infinite}
@keyframes gira{to{transform:translate(-50%,-50%) rotate(360deg)}}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:18px;color:rgba(235,235,245,.6);text-decoration:none;font:500 11px -apple-system,system-ui,sans-serif}
.tab.on{color:#F2EFE9;background:rgba(255,255,255,.1)}
@media (prefers-reduced-motion:reduce){.fut::before,.raios{animation:none}}
</style>
