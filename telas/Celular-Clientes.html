<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celular · Meus clientes</title>
<link rel="stylesheet" href="../assets/fontes/fontes.css">
<style>
body{margin:0;background:#050506}
a{color:#F2EFE9}a:hover{color:#FFFFFF}
.ic{width:22px;height:22px;flex:none;fill:currentColor}
.palco{position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;color:#F2EFE9;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;font-variant-numeric:tabular-nums;background:radial-gradient(90% 60% at 70% 10%,#26262a 0%,#0d0d0f 50%,#050506 100%);display:flex;flex-direction:column}
.vidro{position:relative;background:rgba(44,44,48,.52);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 0 0 .5px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.22)}
.rot{font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(235,235,245,.6)}
.seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(0,0,0,.28)}
.seg button{flex:1;font:500 14px -apple-system,system-ui,sans-serif;min-height:40px;border-radius:999px;background:none;border:0;color:rgba(235,235,245,.6)}
.seg button.on{background:rgba(255,255,255,.92);color:#0B0B0C;font-weight:600}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:18px;color:rgba(235,235,245,.6);text-decoration:none;font:500 11px -apple-system,system-ui,sans-serif}
.tab.on{color:#F2EFE9;background:rgba(255,255,255,.1)}
.fut{--w:112px;position:relative;width:var(--w);height:calc(var(--w) * 1.42);flex:none;clip-path:polygon(14% 0,86% 0,100% 6%,100% 86%,50% 100%,0 86%,0 6%);padding:calc(var(--w) * .08) calc(var(--w) * .09) calc(var(--w) * .17);box-sizing:border-box;display:flex;flex-direction:column;font-family:'Barlow Condensed',sans-serif;color:#2B2108;overflow:hidden;background:linear-gradient(160deg,#F6E39A 0%,#D9B455 28%,#A7802C 55%,#E9CE7A 78%,#8C6A22 100%)}
.fut .ovr{font-family:'Bebas Neue',sans-serif;font-size:30px;line-height:.82}
.fut .pos{font-weight:700;font-size:9px;letter-spacing:.1em}
.fut .nome{font-family:'Bebas Neue',sans-serif;font-size:18px;line-height:1;text-align:center;margin-top:auto;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:2px}
.fut .pe{text-align:center;font-weight:600;font-size:7px;letter-spacing:.3em;margin-top:4px;opacity:.75}
.med{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:baseline}
.med b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:28px;line-height:1}
.t{grid-column:1 / -1;display:flex;flex-direction:column;gap:3px}
.t i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,#8C6A22,#F6E39A);box-shadow:0 0 10px rgba(233,206,122,.6)}
.t i.eq{height:3px;background:rgba(235,235,245,.3);box-shadow:none}
</style>
<link rel="stylesheet" href="bancada.css">
<style>
.quad{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.num b{display:block;font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:40px;line-height:1;margin-top:4px}
.num small{display:block;font-size:12px;color:rgba(235,235,245,.6);margin-top:2px}
.volta{display:flex;flex-direction:column;gap:10px}
.volta .linha{display:flex;justify-content:space-between;font-size:13px}
.volta .linha b{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:24px;color:#E9CE7A}
.volta .t{height:7px}
</style>
</head>
<body class="celular">
<script src="base.js"></script>
<div class="palco">
  <div style="padding: 18px 16px 0; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .08em">OTTONI</span>
      <span class="vidro" style="display: inline-flex; align-items: center; gap: 8px; min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; color: rgba(235,235,245,.8)"><span style="width: 7px; height: 7px; border-radius: 50%; background: #63C08E; box-shadow: 0 0 8px #63C08E"></span>até —</span>
    </div>
    <h1 style="margin: 0; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 64px; line-height: .86">Meus<br><span style="color: #8E8E93">clientes</span></h1>
    <div class="seg vidro" role="radiogroup" aria-label="Período"><button role="radio" aria-checked="false">Dia</button><button role="radio" class="on" aria-checked="true">Semana</button><button role="radio" aria-checked="false">Mês</button></div>
    <span class="rot" id="janela">—</span>
    <section class="vidro quad" style="border-radius: 20px; padding: 16px">
      <div class="num" data-k="unicos"><span class="rot">Clientes</span><b>—</b><small>—</small></div>
      <div class="num" data-k="novos"><span class="rot">Novos</span><b>—</b><small>—</small></div>
      <div class="num" data-k="assinantes"><span class="rot">Atendeu assinantes</span><b>—</b><small>—</small></div>
      <div class="num" data-k="ativos"><span class="rot">Assinantes ativos</span><b>—</b><small>—</small></div>
    </section>
    <section class="vidro volta" style="border-radius: 20px; padding: 16px">
      <span class="rot">Quem voltou</span>
      <div class="linha"><span id="v-casa-rot">voltaram à casa</span><b id="v-casa">—</b></div>
      <div class="t"><i id="v-casa-barra" style="width: 0%"></i></div>
      <div class="linha"><span id="v-ele-rot">voltaram com você</span><b id="v-ele">—</b></div>
      <div class="t"><i id="v-ele-barra" style="width: 0%"></i></div>
      <small id="v-nota" style="font-size: 12px; color: rgba(235,235,245,.62)">—</small>
    </section>
    <section class="vidro volta" id="servicos" style="border-radius: 20px; padding: 16px">
      <span class="rot">Meus serviços</span>
      <div id="sv-lista" style="display: flex; flex-direction: column; gap: 6px"></div>
      <small id="sv-nota" style="font-size: 12px; color: rgba(235,235,245,.62)"></small>
    </section>
    <section class="vidro volta" id="novos60" style="border-radius: 20px; padding: 16px">
      <span class="rot">Novos que voltaram em 60 dias</span>
      <div id="nv-lista" style="display: flex; flex-direction: column; gap: 6px"></div>
      <small id="nv-nota" style="font-size: 12px; color: rgba(235,235,245,.62)"></small>
    </section>
    <p style="margin: 0; font-size: 11px; color: rgba(235,235,245,.62)">Pessoas diferentes que você atendeu. Ao lado, a casa no mesmo período.</p>
  </div>
